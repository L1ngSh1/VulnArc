name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # Monday 09:17 Asia/Shanghai; GitHub schedules use UTC.
    - cron: '17 1 * * 1'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install CI tools
        run: python -m pip install -r .github/requirements.txt
      - name: Install locked project dependencies
        run: uv sync --locked --extra dev --python 3.12
      - name: Lint
        run: uv run --no-sync ruff check .
      - name: Tests
        run: uv run --no-sync pytest -q
      - name: Installed wheel regression outside the source directory
        shell: bash
        run: |
          uv build --wheel --out-dir dist
          SOURCE="$PWD"
          uv export --locked --extra dev --no-emit-project --format requirements-txt \
            --output-file "$RUNNER_TEMP/wheel-requirements.txt" > /dev/null
          WHEEL_ENV="$(mktemp -d)/venv"
          uv venv --python 3.12 "$WHEEL_ENV"
          uv pip install --python "$WHEEL_ENV/bin/python" \
            -r "$RUNNER_TEMP/wheel-requirements.txt" "$SOURCE"/dist/vulnarc-*.whl
          TEST_ROOT="$(mktemp -d)"
          cp -R tests schemas .github "$TEST_ROOT/"
          cd "$TEST_ROOT"
          env -u PYTHONPATH "$WHEEL_ENV/bin/python" -c \
            'import vulnarc; assert "site-packages" in vulnarc.__file__; print(vulnarc.__file__)'
          env -u PYTHONPATH "$WHEEL_ENV/bin/python" -m pytest -q -c /dev/null \
            -o pythonpath= --import-mode=prepend -p no:cacheprovider tests

  dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install CI tools
        run: python -m pip install -r .github/requirements.txt
      - name: Export locked runtime and development dependencies
        run: |
          uv export --locked --extra dev --no-emit-project --format requirements-txt \
            --output-file "$RUNNER_TEMP/audit-requirements.txt" > /dev/null
      - name: Check known vulnerabilities
        run: |
          python -m pip_audit --require-hashes --disable-pip --strict \
            --progress-spinner off -r "$RUNNER_TEMP/audit-requirements.txt"
